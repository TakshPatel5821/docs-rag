name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # sentence-transformers (and torch) are not needed: the suite runs against
      # the HashEmbedder double, so CI stays fast and needs no model download.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings httpx \
                      "psycopg[binary]" pgvector pypdf pytest

      - name: Run tests
        run: pytest -q
