services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docsrag
      POSTGRES_PASSWORD: docsrag
      POSTGRES_DB: docsrag
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsrag -d docsrag"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://docsrag:docsrag@db:5432/docsrag
      LLM_PROVIDER: ${LLM_PROVIDER:-echo}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - models:/models

volumes:
  pgdata:
  models:
